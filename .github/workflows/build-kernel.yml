name: Build Miatoll Kernel (Corvus source)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev \
            build-essential git zip curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python2

      - name: Get Proton Clang
        run: |
          git clone -q https://github.com/kdrag0n/proton-clang --depth=1 --single-branch "$HOME/proton"

      - name: Build kernel
        run: |
          set -o pipefail
          export PATH="$HOME/proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          make cust_defconfig O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            GCC_TOOLCHAIN_DIR=/usr/bin/ \
            GCC_TOOLCHAIN=/usr
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            GCC_TOOLCHAIN_DIR=/usr/bin/ \
            GCC_TOOLCHAIN=/usr \
            KCFLAGS="-Wno-error=strict-prototypes" 2>&1 | tee build.log

      - name: Verify kernel outputs exist
        run: |
          ls -la out/arch/arm64/boot/Image.gz-dtb

      - name: Package with the repo's own AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../miatoll-corvus-kernel-$(date +%Y%m%d-%H%M).zip * -x .git README.md

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: flashable-kernel
          path: "*.zip"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log