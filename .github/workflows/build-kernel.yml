name: Build Miatoll Kernel (Corvus source)

on:
  workflow_dispatch:
    inputs:
      defconfig_name:
        description: 'Defconfig file name (e.g., vendor/miatoll-perf_defconfig)'
        required: true
        default: 'vendor/miatoll-perf_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev \
            build-essential git zip curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python2
          # Create python symlink required by older kernel build scripts
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Install KernelSU-Next (legacy) with manual hooks
        run: |
          rm -rf KernelSU KernelSU-Next
          rm -f drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          
          curl -L https://github.com/rifsxd/android_kernel_xiaomi_sm6250/commit/7f5f639fb8d98e893e9bfc14d922e865b42c1806.patch -o ksu_manual_hook.patch
          git apply --reject --whitespace=fix ksu_manual_hook.patch || true
          
          if ! grep -q "extern int ksu_handle_execveat" fs/exec.c; then
            sed -i '/^int do_execve(struct filename \*filename,/i\
#ifdef CONFIG_KSU\
extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\
#endif\
' fs/exec.c
          fi
          
          # Find the actual defconfig specified in the workflow dispatch input
          DEFCONFIG_PATH=$(find arch/arm64/configs -name "${{ github.event.inputs.defconfig_name }}")
          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "Error: Defconfig ${{ github.event.inputs.defconfig_name }} not found in arch/arm64/configs!"
            exit 1
          fi
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG_PATH"

      - name: Get Proton Clang
        run: |
          git clone -q https://github.com/kdrag0n/proton-clang --depth=1 --single-branch "$HOME/proton"

      - name: Build kernel
        run: |
          set -o pipefail
          export PATH="$HOME/proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          
          make ${{ github.event.inputs.defconfig_name }} O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-Wno-error=strict-prototypes" 2>&1 | tee build.log

      - name: Verify kernel outputs exist
        run: |
          ls -la out/arch/arm64/boot/Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          # Clone generic AnyKernel3 repo to ensure the folder exists
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../miatoll-corvus-kernel-$(date +%Y%m%d-%H%M).zip * -x .git README.md

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: flashable-kernel
          path: "*.zip"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
