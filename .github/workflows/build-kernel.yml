name: Build Miatoll Kernel (Corvus source)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev \
            build-essential git zip curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python2

      - name: Install KernelSU-Next (legacy) with manual hooks
        run: |
          rm -rf KernelSU KernelSU-Next
          rm -f drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          ls -la drivers/kernelsu
          curl -L https://github.com/rifsxd/android_kernel_xiaomi_sm6250/commit/7f5f639fb8d98e893e9bfc14d922e865b42c1806.patch -o ksu_manual_hook.patch
          git apply --reject --whitespace=fix ksu_manual_hook.patch || true
          find . -name "*.rej" -exec echo "REJECTED: {}" \; -exec cat {} \;
          if ! grep -q "extern int ksu_handle_execveat" fs/exec.c; then
            awk '/^int do_execve\(struct filename \*filename,/{print "#ifdef CONFIG_KSU"; print "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);"; print "#endif"} {print}' fs/exec.c > fs/exec.c.tmp
            mv fs/exec.c.tmp fs/exec.c
          fi
          grep -n -B2 -A1 "extern int ksu_handle_execveat" fs/exec.c
          grep -rl 'strscpy_pad(' KernelSU-Next/kernel 2>/dev/null | xargs -r sed -i 's/\bstrscpy_pad(/__strscpy_pad(/g'
          grep -rn '__strscpy_pad(' KernelSU-Next/kernel | head -5
          DEFCONFIG=$(find arch/arm64/configs -name cust_defconfig)
          sed -i '/CONFIG_KSU_WITH_KPROBES/d' "$DEFCONFIG"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
          echo "# CONFIG_KSU_WITH_KPROBES is not set" >> "$DEFCONFIG"
          grep -n "CONFIG_KSU" "$DEFCONFIG"

      - name: Get Proton Clang
        run: |
          git clone -q https://github.com/kdrag0n/proton-clang --depth=1 --single-branch "$HOME/proton"

      - name: Build kernel
        run: |
          set -o pipefail
          export PATH="$HOME/proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          make cust_defconfig O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            GCC_TOOLCHAIN_DIR=/usr/bin/ \
            GCC_TOOLCHAIN=/usr
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            GCC_TOOLCHAIN_DIR=/usr/bin/ \
            GCC_TOOLCHAIN=/usr \
            KCFLAGS="-Wno-error=strict-prototypes" 2>&1 | tee build.log

      - name: Verify kernel outputs exist
        run: |
          ls -la out/arch/arm64/boot/Image.gz-dtb

      - name: Package with the repo's own AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../miatoll-corvus-kernel-$(date +%Y%m%d-%H%M).zip * -x .git README.md

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: flashable-kernel
          path: "*.zip"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log