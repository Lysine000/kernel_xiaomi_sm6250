- name: Replace official KernelSU with KernelSU-Next (legacy/non-GKI mode)
        run: |
          rm -rf KernelSU KernelSU-Next
          rm -f drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          echo "=== Verify symlink ==="
          ls -la drivers/kernelsu
          echo "=== Verify Kconfig/Makefile still reference it ==="
          grep -n "kernelsu" drivers/Kconfig
          grep -n "kernelsu" drivers/Makefile
          echo "=== Confirm defconfig has required options ==="
          DEFCONFIG=$(find arch/arm64/configs -name cust_defconfig)
          grep -n "CONFIG_KSU\|CONFIG_KPROBES\|CONFIG_HAVE_KPROBES\|CONFIG_KPROBE_EVENTS" "$DEFCONFIG"
          echo "=== Patch missing strscpy_pad compat calls ==="
          grep -rl 'strscpy_pad(' KernelSU-Next/kernel 2>/dev/null | xargs -r sed -i 's/\bstrscpy_pad(/__strscpy_pad(/g'
          echo "=== Verify patch applied ==="
          grep -rn '__strscpy_pad(' KernelSU-Next/kernel | head -5